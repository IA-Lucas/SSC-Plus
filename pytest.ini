# SSC+ — invocacao da suite. NAO e politica: e realocacao de cache.
#
# POR QUE ESTE ARQUIVO EXISTE (P1-A.5.1, ordem 2). A contencao acusou a
# propria sessao DUAS vezes durante a janela de uma chamada de revisor
# (P1-A.3.6 §6 e P1-A.4 §6). Na segunda, das QUATRO mutacoes acusadas,
# TRES nao eram do operador — eram subproduto do interpretador e do
# pytest escrevendo cache DENTRO da arvore vigiada:
#
#     alterado: repositorio/.pytest_cache/v/cache/lastfailed
#     alterado: repositorio/06_p1a/__pycache__/leitores_config....pyc
#     alterado: repositorio/06_p1a/tests/__pycache__/test_redacao....pyc
#
# Medido: com o cache fora da arvore, a suite produz ZERO mutacao no
# manifesto SHA-256 (`contencao.manifesto`) em quatro condicoes. As tres
# somem sem porta nenhuma, sem mudar politica e sem tocar em guarda.
# A QUARTA — a sessao editando um fonte — nao e alcancada por aqui, e
# continua sendo o achado aberto; ver `06_p1a/99_decisao-p1a51.md` §3.
#
# `-p no:cacheprovider` desliga o cache do pytest em vez de reloca-lo.
# A escolha foi MEDIDA, e nao estetica: relocar exige `cache_dir` com
# caminho ABSOLUTO, e um caminho absoluto neste arquivo versionado
# carregaria o nome do usuario local — exatamente o que a redacao de PII
# do acervo existe para impedir. Desligar nao escreve caminho nenhum.
#
# CUSTO DECLARADO: `--lf`, `--ff` e `--sw` deixam de funcionar, porque
# dependem do cache. Medido: NENHUM ponto do acervo os usa — as unicas
# mencoes a `lastfailed` sao os registros da propria violacao.
[pytest]
addopts = -p no:cacheprovider
