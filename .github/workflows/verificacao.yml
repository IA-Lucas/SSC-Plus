name: verificacao-ssc-plus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verificar.py
